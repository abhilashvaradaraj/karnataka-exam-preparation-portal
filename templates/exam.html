<!doctype html><html lang="en" data-bs-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body>
<div class="exam-bar"><div><b>{{ t.title }}</b><div class="small">+{{ t.mark_per_question }} correct · −{{ t.negative_mark }} wrong · unanswered 0</div></div>
 <div class="text-end"><div class="small">Time left</div><div id="timer">--:--</div></div></div>
<div class="container-fluid py-3"><div class="row g-3">
 <div class="col-lg-9"><div class="card p-4">
  <div class="meta mb-2" id="qno"></div><div class="qtext mb-3" id="qtext"></div><div id="opts"></div>
  <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
   <button class="btn btn-outline-secondary" id="prev">Previous</button><button class="btn btn-primary" id="next">Next</button>
   <button class="btn btn-outline-secondary" id="clear">Clear answer</button>
   <div class="form-check ms-2"><input class="form-check-input" type="checkbox" id="review"><label class="form-check-label" for="review">Mark for review</label></div>
   <button class="btn btn-accent ms-auto" id="submit">Submit test</button></div></div></div>
 <div class="col-lg-3"><div class="card p-3"><h2 class="h6">Question palette</h2><div class="palette mb-3" id="palette"></div>
  <div class="legend small"><div><i style="background:#1f7a4d"></i>Answered</div><div><i style="background:#b3261e"></i>Visited, not answered</div><div><i style="background:#6f42c1"></i>Marked for review</div><div><i style="border:1px solid #999"></i>Not visited</div></div>
  <div class="meta mt-2" id="cnt"></div></div></div>
</div></div>
<script>window.EXAM={rid:{{ r.id }},left:{{ left }},questions:{{ data|tojson }},saved:{{ saved|tojson }},
 saveUrl:{{ url_for('tests.save', rid=r.id)|tojson }},submitUrl:{{ url_for('tests.submit', rid=r.id)|tojson }}};</script>
<script src="{{ url_for('static', filename='js/exam.js') }}"></script></body></html>
